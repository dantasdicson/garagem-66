services:
  db:
    image: postgres:16-alpine
    container_name: garagem66-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garagem66}
      POSTGRES_USER: ${POSTGRES_USER:-garagem66}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garagem66}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
